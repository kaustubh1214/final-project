services:
  backend:
    build:
      context: ./backend
    image: naayvadh-backend:latest
    container_name: naayvadh-backend
    restart: unless-stopped
    environment:
      # AI (set your working key in .env)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      # Auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      # Database — persisted on the named volume below
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/naayvadh.db}
      # CORS — same-origin via nginx by default; override for cross-origin setups
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"
    networks:
      - naayvadh-net

  frontend:
    build:
      context: ./frontend
    image: naayvadh-frontend:latest
    container_name: naayvadh-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host port is configurable; container always listens on 80
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - naayvadh-net

volumes:
  backend_data:
    driver: local

networks:
  naayvadh-net:
    driver: bridge
